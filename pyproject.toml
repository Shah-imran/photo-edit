[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photoedit"
version = "0.1.0"
description = "A Lightroom-inspired photo editing application built with Python and PyQt6."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "PyQt6==6.6.1",
    "PyQt6-Qt6==6.6.1",
    "PyQt6-sip==13.6.0",
    "Pillow",
    "numpy",
    "opencv-python",
    "rawpy",
    "piexif",
    "colorspacious",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
    "pytest-cov",
    "pytest-mock",
    "hypothesis",
    "faker",
]

[project.scripts]
photoedit = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

