[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photoedit"
version = "0.1.0"
description = "A Lightroom-inspired photo editing application built with Python and PyQt6."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "PyQt6==6.6.1",
    "PyQt6-Qt6==6.6.1",
    "PyQt6-sip==13.6.0",
    "Pillow",
    "numpy",
    "opencv-python",
    "rawpy",
    "piexif",
    "colorspacious",
    # Compiled multi-threaded pixel kernels (src/utils/pixel_kernels.py);
    # the app falls back to NumPy if it is missing.
    "numba",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
    "pytest-cov",
    "pytest-mock",
    "hypothesis",
    "faker",
]

[project.scripts]
photoedit = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: real worker threads, real files or the full MainWindow",
    "perf: wall-clock time budgets (skipped under coverage tracing)",
    "raw: needs camera RAW files in test_images/ (skipped when absent)",
]

